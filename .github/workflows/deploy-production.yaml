name: Deploy production

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful Deploy staging run ID for this selected commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Request production deployment
    runs-on: [self-hosted, Linux, X64, web-app-ci]
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      packages: read
      deployments: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select exact verified staging pair
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: python3 -I -S infrastructure/release/client.py promote --staging-run "$STAGING_RUN_ID"
      - name: Prepare encrypted controller request
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          DEPLOY_CONTROLLER_CERT: ${{ vars.DEPLOY_CONTROLLER_CERT }}
        run: |
          python3 -I -S infrastructure/release/client.py request --environment production \
            --staging-run "$STAGING_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-request-${{ github.run_attempt }}
          path: request.cms
          if-no-files-found: error
          retention-days: 1
      - name: Wait for verified server result
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -S infrastructure/release/client.py wait
