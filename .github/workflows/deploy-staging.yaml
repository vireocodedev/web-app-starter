name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build:
    name: Build staging candidates
    runs-on: [self-hosted, Linux, X64, web-app-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/toolcache
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/toolcache
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false
      - name: Verify exact checkout and both applications
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -m unittest discover -s infrastructure/ci/tests -p 'test_*.py'
          python3 -B -m unittest discover -s infrastructure/release/tests -p 'test_*.py'
          (cd backend && ./gradlew --no-daemon --console=plain clean test bootJar)
          package_manager=$(node -p 'require("./frontend/package.json").packageManager')
          [[ "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global --prefix "$RUNNER_TEMP/npm" "$package_manager"
          export PATH="$RUNNER_TEMP/npm/bin:$PATH"
          (cd frontend && npm ci && npm run verify)
      - name: Build the candidate image pair
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          for component in backend frontend; do
            docker build --platform linux/amd64 --build-arg SOURCE_SHA="$GITHUB_SHA" \
              --build-arg SOURCE_URL="$SOURCE_URL" --tag "vireo-$component:verified" "$component"
          done
          docker save --output "$RUNNER_TEMP/candidate-images.tar" \
            vireo-backend:verified vireo-frontend:verified
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-images.tar
          if-no-files-found: error
          retention-days: 1

  release:
    name: Verify and publish staging pair
    needs: build
    runs-on: [self-hosted, Linux, X64, web-app-ci]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Independently verify candidates in a fresh worker
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          docker load --input "$RUNNER_TEMP/candidate/candidate-images.tar"
          python3 -I -S infrastructure/release/smoke_images.py --source-sha "$GITHUB_SHA" \
            --backend vireo-backend:verified --frontend vireo-frontend:verified
      - name: Publish private immutable pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -S infrastructure/release/client.py publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pair-${{ github.run_attempt }}
          path: release-pair.json
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Request staging deployment
    needs: release
    runs-on: [self-hosted, Linux, X64, web-app-ci]
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      packages: read
      deployments: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pair-${{ github.run_attempt }}
      - name: Prepare encrypted controller request
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_CONTROLLER_CERT: ${{ vars.DEPLOY_CONTROLLER_CERT }}
        run: python3 -I -S infrastructure/release/client.py request --environment staging
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-request-${{ github.run_attempt }}
          path: request.cms
          if-no-files-found: error
          retention-days: 1
      - name: Wait for verified server result
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -S infrastructure/release/client.py wait
