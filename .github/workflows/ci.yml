name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: [self-hosted, Linux, X64, web-app-ci]
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      foundation: ${{ steps.scope.outputs.foundation }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select verification jobs
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 -B infrastructure/ci/ci_scope.py detect
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/toolcache
        with:
          node-version-file: .agents/skills/initialize-project/package.json
          package-manager-cache: false
      - name: Verify portable discovery specification skill
        run: npm --prefix .agents/skills/discovery-specification run verify
      - name: Verify portable initialization package and public documentation
        run: |
          package=.agents/skills/initialize-project
          package_manager=$(node -p 'require("./.agents/skills/initialize-project/package.json").packageManager')
          [[ "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global --prefix "$RUNNER_TEMP/npm" "$package_manager"
          export PATH="$RUNNER_TEMP/npm/bin:$PATH"
          npm --prefix "$package" ci
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/documentation-browsers"
          npm --prefix "$package" run browser:install
          npm --prefix "$package" run verify
          npm --prefix "$package" run test:portable-install

  backend:
    name: Backend verification
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: [self-hosted, Linux, X64, web-app-ci]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/toolcache
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify backend and fresh PostgreSQL authentication
        run: ./gradlew --no-daemon --console=plain clean test bootJar
      - name: Build and smoke-test backend image
        working-directory: .
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build --platform linux/amd64 --build-arg SOURCE_SHA="$SOURCE_SHA" \
            --build-arg SOURCE_URL="$SOURCE_URL" --tag vireo-backend-ci:verified backend
          python3 -B infrastructure/release/smoke_images.py \
            --backend vireo-backend-ci:verified --source-sha "$SOURCE_SHA"

  frontend:
    name: Frontend verification
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, Linux, X64, web-app-ci]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/toolcache
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false
      - name: Select pinned npm in the disposable job
        run: |
          package_manager=$(node -p 'require("./package.json").packageManager')
          [[ "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global --prefix "$RUNNER_TEMP/npm" "$package_manager"
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: npm ci
      - name: Verify frontend
        run: npm run verify
      - name: Build and smoke-test frontend image
        working-directory: .
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build --platform linux/amd64 --build-arg SOURCE_SHA="$SOURCE_SHA" \
            --build-arg SOURCE_URL="$SOURCE_URL" --tag vireo-frontend-ci:verified frontend
          python3 -B infrastructure/release/smoke_images.py \
            --frontend vireo-frontend-ci:verified --source-sha "$SOURCE_SHA"

  foundation:
    name: Foundation verification
    needs: changes
    if: needs.changes.outputs.foundation == 'true'
    runs-on: [self-hosted, Linux, X64, web-app-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify source-local lifecycle, authentication, and CI policy
        run: |
          python3 -B -m unittest discover -s infrastructure/ci/tests -p 'test_*.py' -v
          python3 -B -m unittest discover -s infrastructure/release/tests -p 'test_*.py' -v
          bash -n infrastructure/ci/ci-runner/install.sh infrastructure/ci/ci-runner/start-job.sh

  gate:
    name: CI gate
    needs: [changes, backend, frontend, foundation]
    if: always()
    runs-on: [self-hosted, Linux, X64, web-app-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Enforce selected job outcomes
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B infrastructure/ci/ci_scope.py gate
