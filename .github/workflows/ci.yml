name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: [self-hosted, Linux, X64, web-app-ci]
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      foundation: ${{ steps.scope.outputs.foundation }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select verification jobs
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 -B infrastructure/ci/ci_scope.py detect

  backend:
    name: Backend image and smoke verification
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: [self-hosted, Linux, X64, web-app-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and smoke-test backend image
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build --platform linux/amd64 --build-arg SOURCE_SHA="$SOURCE_SHA" \
            --build-arg SOURCE_URL="$SOURCE_URL" --tag vireo-backend-ci:verified backend
          python3 -B infrastructure/release/smoke_images.py \
            --backend vireo-backend-ci:verified --source-sha "$SOURCE_SHA"

  backend-tests:
    name: Backend tests (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: [self-hosted, Linux, X64, web-app-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/toolcache
        with:
          distribution: temurin
          java-version: "21"
      - name: Collect full JUnit inventory and execute assigned classes
        run: python3 -B infrastructure/ci/test_shards.py run backend --shard ${{ matrix.shard }} --output "$RUNNER_TEMP/backend-report"
      - name: Preserve source-bound backend inventory and execution report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-report/shard-report.json
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend static verification
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, Linux, X64, web-app-ci]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/toolcache
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false
      - name: Select pinned npm in the disposable job
        run: |
          package_manager=$(node -p 'require("./package.json").packageManager')
          [[ "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global --prefix "$RUNNER_TEMP/npm" "$package_manager"
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: npm ci
      - name: Verify formatting, lint, architecture and all TypeScript projects
        run: npm run format:check && npm run lint && npm run verify:architecture && npm run verify:dev-guide && npm run typecheck

  frontend-tests:
    name: Frontend tests (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: [self-hosted, Linux, X64, web-app-ci]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/toolcache
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false
      - name: Select pinned npm in the disposable job
        run: |
          package_manager=$(node -p 'require("./package.json").packageManager')
          [[ "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global --prefix "$RUNNER_TEMP/npm" "$package_manager"
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: npm ci
      - name: Collect complete Vitest inventory and execute assigned files
        working-directory: .
        run: python3 -B infrastructure/ci/test_shards.py run frontend --shard ${{ matrix.shard }} --output "$RUNNER_TEMP/frontend-report"
      - name: Preserve source-bound frontend inventory and execution report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-report/shard-report.json
          if-no-files-found: error
          retention-days: 7

  frontend-build:
    name: Frontend Storybook, image and smoke verification
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: [self-hosted, Linux, X64, web-app-ci]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/toolcache
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false
      - name: Select pinned npm in the disposable job
        run: |
          package_manager=$(node -p 'require("./package.json").packageManager')
          [[ "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global --prefix "$RUNNER_TEMP/npm" "$package_manager"
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: npm ci
      - name: Build Storybook
        run: npm run build-storybook
      - name: Build and smoke-test frontend image
        working-directory: .
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build --platform linux/amd64 --build-arg SOURCE_SHA="$SOURCE_SHA" \
            --build-arg SOURCE_URL="$SOURCE_URL" --tag vireo-frontend-ci:verified frontend
          python3 -B infrastructure/release/smoke_images.py \
            --frontend vireo-frontend-ci:verified --source-sha "$SOURCE_SHA"

  foundation:
    name: Foundation verification
    needs: changes
    if: needs.changes.outputs.foundation == 'true'
    runs-on: [self-hosted, Linux, X64, web-app-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify source-local lifecycle, authentication, and CI policy
        run: |
          python3 -B -m unittest discover -s infrastructure/ci/tests -p 'test_*.py' -v
          python3 -B -m unittest discover -s infrastructure/release/tests -p 'test_*.py' -v
          bash -n infrastructure/ci/ci-runner/install.sh infrastructure/ci/ci-runner/start-job.sh

  gate:
    name: CI gate
    needs: [changes, backend, backend-tests, frontend, frontend-tests, frontend-build, foundation]
    if: always()
    runs-on: [self-hosted, Linux, X64, web-app-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Enforce every selected lane outcome
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B infrastructure/ci/ci_scope.py gate
      - name: Download reports from this workflow attempt only
        if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-shard-*-${{ github.run_attempt }}'
          path: ${{ runner.temp }}/ci-reports
      - name: Prove complete frontend execution without extra skips
        if: needs.changes.outputs.frontend == 'true'
        run: python3 -B infrastructure/ci/test_shards.py verify frontend --reports "$RUNNER_TEMP/ci-reports"
      - name: Prove complete backend execution without extra skips
        if: needs.changes.outputs.backend == 'true'
        run: python3 -B infrastructure/ci/test_shards.py verify backend --reports "$RUNNER_TEMP/ci-reports"
