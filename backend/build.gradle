plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.vireocode'
version = '0.0.1-SNAPSHOT'
description = 'VireoCode Web App Starter backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.tngtech.archunit:archunit:1.5.1'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Each CI lane compiles the complete source set, including cross-test fixtures.
// Discovery uses JUnit through Gradle's supported dry-run mode: no test bodies,
// Spring contexts or application databases are started by inventory collection.
tasks.register('ciTestInventory', Test) {
	dependsOn tasks.named('testClasses')
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	dryRun = true
	maxParallelForks = 1
	reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/ciTestInventory')
}

// Each cached context owns a server, pool and PostgreSQL container. Retain the
// eviction contract while independent CI jobs use separate databases/daemons.
tasks.withType(Test).configureEach {
	maxParallelForks = 1
	jvmArgs '-XX:ActiveProcessorCount=2'
	systemProperty 'spring.test.context.cache.maxSize', '2'

	// Keep the actual Docker/container startup response in failed CI test output.
	testLogging.exceptionFormat = 'full'
}

tasks.named('test') {
	if (providers.gradleProperty('ciTestClassesFile').isPresent()) {
		def classesFile = file(providers.gradleProperty('ciTestClassesFile').get())
		def classes = classesFile.readLines().findAll { !it.isBlank() }
		if (classes.isEmpty() || classes.any { !(it ==~ /[a-zA-Z_$][a-zA-Z0-9_$.]*/) }) {
			throw new GradleException('Invalid or empty CI class selection')
		}
		filter {
			classes.each {
				includeTestsMatching(it)
				includeTestsMatching(it + '$*')
			}
			failOnNoMatchingTests = true
		}
	}
}
