spring:
  application:
    name: vireocode-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    disable-swagger-default-url: true
    persist-authorization: false
  paths-to-exclude:
    - /error
    - /actuator/**
  override-with-generic-response: false
