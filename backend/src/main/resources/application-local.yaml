spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:55436}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

server:
  address: 127.0.0.1
  servlet:
    session:
      cookie:
        secure: false

app:
  bootstrap-user:
    username: ${INITIAL_USER_USERNAME}
    email: ${INITIAL_USER_EMAIL}
    display-name: ${INITIAL_USER_DISPLAY_NAME}
    password: ${INITIAL_USER_PASSWORD}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
